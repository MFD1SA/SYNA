name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # No dedicated script; invoke tsc directly via the project tsconfig.
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build
        env:
          # Vite requires the publishable key at build-time. CI uses a dummy
          # value — we never deploy artifacts from CI, only verify the build
          # is green. Real deploys happen from Vercel with real secrets.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
