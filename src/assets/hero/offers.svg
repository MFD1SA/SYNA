<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1826"/><stop offset="100%" stop-color="#14283B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8F6F3A"/><stop offset="50%" stop-color="#E4C97A"/><stop offset="100%" stop-color="#A88A4A"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M 80 0 L 0 0 0 80" fill="none" stroke="#C2A86B" stroke-opacity="0.05"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#E4C97A" stop-opacity="0.2"/><stop offset="100%" stop-color="#E4C97A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1920" height="900" fill="url(#sky)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <circle cx="960" cy="450" r="450" fill="url(#glow)"/>
  <g opacity="0.12" fill="none" stroke="url(#gold)" stroke-width="1.5">
    <g transform="translate(180 170)"><polygon points="0,-56 14,-14 56,0 14,14 0,56 -14,14 -56,0 -14,-14"/></g>
    <g transform="translate(1740 730)"><polygon points="0,-56 14,-14 56,0 14,14 0,56 -14,14 -56,0 -14,-14"/></g>
  </g>
  <line x1="120" y1="840" x2="1800" y2="840" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <!-- Emblem: three geometric tower silhouettes -->
  <g transform="translate(960 450)">
    <circle r="290" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-dasharray="3 8" opacity="0.5"/>
    <g fill="none" stroke="url(#gold)" stroke-width="2.5">
      <rect x="-170" y="-40" width="85" height="180"/>
      <rect x="-42" y="-125" width="85" height="265"/>
      <rect x="85" y="-75" width="85" height="215"/>
    </g>
    <!-- Rooftop accents -->
    <g fill="url(#gold)" opacity="0.85">
      <rect x="-170" y="-45" width="85" height="5"/>
      <polygon points="-42,-125 43,-125 0,-150"/>
      <rect x="85" y="-80" width="85" height="5"/>
    </g>
    <!-- Windows (minimal grid) -->
    <g fill="url(#gold)" opacity="0.55">
      <rect x="-150" y="0" width="10" height="10"/><rect x="-120" y="0" width="10" height="10"/>
      <rect x="-150" y="40" width="10" height="10"/><rect x="-120" y="40" width="10" height="10"/>
      <rect x="-150" y="80" width="10" height="10"/><rect x="-120" y="80" width="10" height="10"/>

      <rect x="-22" y="-85" width="10" height="10"/><rect x="12" y="-85" width="10" height="10"/>
      <rect x="-22" y="-45" width="10" height="10"/><rect x="12" y="-45" width="10" height="10"/>
      <rect x="-22" y="-5" width="10" height="10"/><rect x="12" y="-5" width="10" height="10"/>
      <rect x="-22" y="35" width="10" height="10"/><rect x="12" y="35" width="10" height="10"/>
      <rect x="-22" y="75" width="10" height="10"/><rect x="12" y="75" width="10" height="10"/>

      <rect x="105" y="-35" width="10" height="10"/><rect x="140" y="-35" width="10" height="10"/>
      <rect x="105" y="5" width="10" height="10"/><rect x="140" y="5" width="10" height="10"/>
      <rect x="105" y="45" width="10" height="10"/><rect x="140" y="45" width="10" height="10"/>
      <rect x="105" y="85" width="10" height="10"/><rect x="140" y="85" width="10" height="10"/>
    </g>
    <!-- ground line -->
    <line x1="-220" y1="140" x2="220" y2="140" stroke="url(#gold)" stroke-width="2"/>
    <!-- surveyor tick marks -->
    <g stroke="url(#gold)" stroke-width="1.2" opacity="0.7">
      <line x1="-220" y1="135" x2="-220" y2="150"/>
      <line x1="-110" y1="135" x2="-110" y2="150"/>
      <line x1="0" y1="135" x2="0" y2="150"/>
      <line x1="110" y1="135" x2="110" y2="150"/>
      <line x1="220" y1="135" x2="220" y2="150"/>
    </g>
  </g>
</svg>
