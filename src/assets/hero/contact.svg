<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0B1826"/><stop offset="100%" stop-color="#14283B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8F6F3A"/><stop offset="50%" stop-color="#E4C97A"/><stop offset="100%" stop-color="#A88A4A"/></linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M 80 0 L 0 0 0 80" fill="none" stroke="#C2A86B" stroke-opacity="0.05"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#E4C97A" stop-opacity="0.2"/><stop offset="100%" stop-color="#E4C97A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1920" height="900" fill="url(#sky)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <circle cx="960" cy="450" r="450" fill="url(#glow)"/>
  <g opacity="0.12" fill="none" stroke="url(#gold)" stroke-width="1.5">
    <g transform="translate(180 170)"><polygon points="0,-56 14,-14 56,0 14,14 0,56 -14,14 -56,0 -14,-14"/></g>
    <g transform="translate(1740 730)"><polygon points="0,-56 14,-14 56,0 14,14 0,56 -14,14 -56,0 -14,-14"/></g>
  </g>
  <line x1="120" y1="840" x2="1800" y2="840" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <!-- Emblem: concentric signal rings radiating from central core -->
  <g transform="translate(960 450)">
    <circle r="290" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-dasharray="3 8" opacity="0.5"/>
    <g fill="none" stroke="url(#gold)">
      <circle r="240" stroke-width="0.8" opacity="0.22"/>
      <circle r="190" stroke-width="1" opacity="0.35"/>
      <circle r="140" stroke-width="1.3" opacity="0.55"/>
      <circle r="90" stroke-width="1.8" opacity="0.85"/>
    </g>
    <!-- connecting radial lines -->
    <g stroke="url(#gold)" stroke-width="0.6" opacity="0.35">
      <line x1="0" y1="-240" x2="0" y2="-90"/>
      <line x1="0" y1="240" x2="0" y2="90"/>
      <line x1="-240" y1="0" x2="-90" y2="0"/>
      <line x1="240" y1="0" x2="90" y2="0"/>
    </g>
    <!-- central core -->
    <circle r="32" fill="url(#gold)" opacity="0.9"/>
    <circle r="14" fill="#0F1F2E"/>
    <circle r="5" fill="url(#gold)"/>
  </g>
</svg>
